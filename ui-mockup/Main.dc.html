<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Karla:wght@400;500;700&display=swap">
  <style>
    :root{
      --bg: oklch(97% 0.014 85);
      --surface: oklch(99% 0.006 85);
      --ink: oklch(23% 0.02 50);
      --muted: oklch(52% 0.02 55);
      --border: oklch(89% 0.014 70);
      --flame: oklch(64% 0.19 45);
      --bp: oklch(64% 0.14 78);
      --bp-tint: oklch(94% 0.03 78);
      --gj: oklch(64% 0.14 262);
      --gj-tint: oklch(94% 0.025 262);
      --bl: oklch(64% 0.14 165);
      --bl-tint: oklch(94% 0.03 165);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--bp); }
    a:hover { color: var(--bl); }
  </style>
</helmet>

<div style="width:390px;height:510px;position:relative;overflow:hidden;background:var(--bg);font-family:'Karla',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);">

  <div style="position:absolute;inset:0 0 76px 0;overflow-y:auto;padding:50px 20px 24px 20px;display:flex;flex-direction:column;gap:22px;">

    <!-- Header -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;">
      <div style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-family:'Spectral',Georgia,serif;font-size:21px;font-weight:600;">Good evening</span>
        <span style="font-size:12px;color:var(--muted);">Friday, 11 September &middot; +50 pts today</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 13px;flex-shrink:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--flame)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.4 0 7-3.1 7-7 0-4-3-6.2-4-10-1 2-1 4-3 4-1 0-1-2-1-3-3 3-6 6.4-6 9.4C5 18.9 7.6 22 12 22Z"/></svg>
        <span style="font-size:13px;font-weight:700;">12</span>
      </div>
    </div>

    <!-- Pillar cards -->
    <div style="display:flex;flex-direction:column;gap:12px;">

      <!-- Growth -->
      <div style="display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--bp-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--bp)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2-1 5-1 7 1v13c-2-2-5-2-7-1v-13Z"/><path d="M20 5.5c-2-1-5-1-7 1v13c2-2 5-2 7-1v-13Z"/></svg>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;">
          <div style="display:flex;align-items:baseline;justify-content:space-between;">
            <span style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:15px;">Growth</span>
            <span style="font-size:11px;font-weight:700;color:var(--bp);background:var(--bp-tint);padding:2px 9px;border-radius:8px;">Lv 4</span>
          </div>
          <div style="height:8px;border-radius:6px;background:var(--border);overflow:hidden;">
            <div style="height:100%;width:72%;background:var(--bp);border-radius:6px;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);">
            <span>180 / 250 XP</span>
            <span style="display:flex;align-items:center;gap:3px;color:oklch(55% 0.11 145);"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-8 6 8"/></svg>+15 today</span>
          </div>
        </div>
      </div>

      <!-- Career -->
      <div style="display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--gj-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--gj)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="2.2"/><path d="M8.5 8V6.2A2.2 2.2 0 0 1 10.7 4h2.6a2.2 2.2 0 0 1 2.2 2.2V8"/></svg>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;">
          <div style="display:flex;align-items:baseline;justify-content:space-between;">
            <span style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:15px;">Career</span>
            <span style="font-size:11px;font-weight:700;color:var(--gj);background:var(--gj-tint);padding:2px 9px;border-radius:8px;">Lv 2</span>
          </div>
          <div style="height:8px;border-radius:6px;background:var(--border);overflow:hidden;">
            <div style="height:100%;width:97%;background:var(--gj);border-radius:6px;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);">
            <span>145 / 150 XP</span>
            <span>no activity yet</span>
          </div>
        </div>
      </div>

      <!-- Wellbeing -->
      <div style="display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--bl-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--bl)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.3s-7-4.3-9-8.7a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.4-9 8.7-9 8.7Z"/></svg>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;">
          <div style="display:flex;align-items:baseline;justify-content:space-between;">
            <span style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:15px;">Wellbeing</span>
            <span style="font-size:11px;font-weight:700;color:var(--bl);background:var(--bl-tint);padding:2px 9px;border-radius:8px;">Lv 5</span>
          </div>
          <div style="height:8px;border-radius:6px;background:var(--border);overflow:hidden;">
            <div style="height:100%;width:77%;background:var(--bl);border-radius:6px;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);">
            <span>310 / 400 XP</span>
            <span style="display:flex;align-items:center;gap:3px;color:oklch(55% 0.11 145);"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-8 6 8"/></svg>+25 today</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom nav -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:76px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding-bottom:12px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h4.5v-5.5h3V20H18v-9.5"/></svg>
      <span style="font-size:10px;font-weight:600;">Home</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="4" cy="6.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="17.5" r="1.4" fill="currentColor" stroke="none"/><path d="M9 6.5h11M9 12h11M9 17.5h11"/></svg>
      <span style="font-size:10px;">Habits</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-8M22 20H2"/></svg>
      <span style="font-size:10px;">Progress</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
